services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: securecorp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  identity-kdc:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        APP_NAME: identity-kdc
    env_file:
      - ./env/secure.env
    environment:
      PORT: 3001
      AUDIT_URL: http://audit-log:3003/api
    ports:
      - "3001:3001"
    depends_on:
      - audit-log
      - redis

  policy-pdp:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        APP_NAME: policy-pdp
    env_file:
      - ./env/secure.env
    environment:
      PORT: 3002
      AUDIT_URL: http://audit-log:3003/api
    ports:
      - "3002:3002"
    depends_on:
      - audit-log

  audit-log:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        APP_NAME: audit-log
    env_file:
      - ./env/secure.env
    environment:
      PORT: 3003
    ports:
      - "3003:3003"

  resource-hr:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        APP_NAME: resource-hr
    env_file:
      - ./env/secure.env
    environment:
      PORT: 3011
      PDP_URL: http://policy-pdp:3002/api
      AUDIT_URL: http://audit-log:3003/api
    ports:
      - "3011:3011"
    depends_on:
      - policy-pdp
      - audit-log
      - redis

  resource-finance:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        APP_NAME: resource-finance
    env_file:
      - ./env/secure.env
    environment:
      PORT: 3012
      PDP_URL: http://policy-pdp:3002/api
      AUDIT_URL: http://audit-log:3003/api
    ports:
      - "3012:3012"
    depends_on:
      - policy-pdp
      - audit-log
      - redis

  resource-it:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        APP_NAME: resource-it
    env_file:
      - ./env/secure.env
    environment:
      PORT: 3013
      PDP_URL: http://policy-pdp:3002/api
      AUDIT_URL: http://audit-log:3003/api
    ports:
      - "3013:3013"
    depends_on:
      - policy-pdp
      - audit-log
      - redis

  resource-operations:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
      args:
        APP_NAME: resource-operations
    env_file:
      - ./env/secure.env
    environment:
      PORT: 3014
      PDP_URL: http://policy-pdp:3002/api
      AUDIT_URL: http://audit-log:3003/api
    ports:
      - "3014:3014"
    depends_on:
      - policy-pdp
      - audit-log
      - redis